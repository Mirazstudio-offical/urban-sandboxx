<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="orientation" content="landscape" />
    <title>Top-Down City Simulator</title>
    <meta name="description" content="A fully-featured, high-performance 2D top-down open world city simulator with realistic car physics, intelligent AI traffic, building interiors, player survival mechanics (health, hunger, thirst, fatigue, sleepiness), and rich interactive inventory." />
    <meta property="og:title" content="Top-Down City Simulator" />
    <meta property="og:description" content="A fully-featured, high-performance 2D top-down open world city simulator with realistic car physics, intelligent AI traffic, building interiors, player survival mechanics (health, hunger, thirst, fatigue, sleepiness), and rich interactive inventory." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
    <script>
      // Prevent context menus, long press popups and browser gestures on mobile
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault(); // Prevent multi-touch zoom
        }
      }, { passive: false });
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, false);
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, false);
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, false);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
