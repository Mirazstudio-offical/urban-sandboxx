<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="screen-orientation" content="landscape" />
    <meta name="orientation" content="landscape" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-title" content="Flatbody" />
    <meta name="application-name" content="Flatbody" />
    <title>Flatbody: Симулятор Вождения и Открытого Мира</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" sizes="180x180" href="/apple-touch-icon-precomposed.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="Реалистичный 2D симулятор открытого мира с физикой автомобилей, трафиком ИИ, интерьерами зданий, выживанием и инвентарем." />
    <meta property="og:title" content="Flatbody: Симулятор Вождения и Открытого Мира" />
    <meta property="og:description" content="Реалистичный 2D симулятор открытого мира с физикой автомобилей, трафиком ИИ, интерьерами зданий, выживанием и инвентарем." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        touch-action: none;
        overscroll-behavior: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
    </style>
    <script>
      // Prevent context menus, long press popups and browser gestures on mobile
      document.addEventListener('contextmenu', function(e) { e.preventDefault(); }, false);
      document.addEventListener('touchstart', function(e) {
        if (e.touches.length > 1) {
          e.preventDefault(); // Prevent multi-touch zoom
        }
      }, { passive: false });
      document.addEventListener('gesturestart', function(e) { e.preventDefault(); }, false);
      document.addEventListener('gesturechange', function(e) { e.preventDefault(); }, false);
      document.addEventListener('gestureend', function(e) { e.preventDefault(); }, false);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
