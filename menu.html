  }
  renderSrv('all');
  $('#badges').innerHTML = ['M12 6v6l3 2M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18', 'M3 18l6-10 4 6 3-4 5 8z', 'M4 16h16M6 16l1-5h10l1 5M8 19h.01M16 19h.01', STAR, LOCKD, LOCKD, LOCKD, LOCKD].map(function (d, i) {
    var on = i < 4;
    return '<div class="badge' + (on ? '' : ' badge-off') + '"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="' + (on ? '#e0ab45' : '#6f6c65') + '" stroke-width="1.8"><path d="' + d + '"/></svg></div>';
  }).join('');
  $('#friends').innerHTML = [['А', '#e0ab45', 'Alex_Dune', 'На сервере «Перевал»', '#7fbf6a'], ['М', '#c9b98f', 'MariaK', 'Свободная езда', '#7fbf6a'], ['Т', '#b98a4a', 'tormoz_pro', 'В главном меню', '#7fbf6a'], ['Д', '#4a4741', 'Dimitri', 'Был в сети вчера', '#5c5a54']].map(function (f) {
    return '<div class="fr"><span class="av" style="background:' + f[1] + '">' + f[0] + '</span><div style="flex:1"><div style="font-weight:600">' + f[2] + '</div><div class="mut" style="font-size:13px">' + f[3] + '</div></div><span class="dot" style="background:' + f[4] + '"></span></div>';
  }).join('');

  // selection
  function setMap(i) {
    var m = MAPS[i];
    [].forEach.call($('#maps').children, function (c, j) { c.classList.toggle('card-on', j === i); });
    $('#mThumb').className = 'th ' + m[2];
    $('#mName').textContent = m[0];
    $('#nName').textContent = m[0] + ' · первая поездка';
  }
  function setSave(i) {
    [].forEach.call($('#saves').querySelectorAll('.card'), function (c, j) {
      c.classList.toggle('card-on', j === i);
      c.querySelector('.mk').textContent = j === i ? 'Выбрано' : '';
    });
    $('#saveSel').textContent = SAVES[i][0];
  }
  function setSrv(i) {
    var v = SRV[i];
    [].forEach.call($('#srvlist').children, function (c) { c.classList.toggle('row-on', +c.dataset.i === i); });
    $('#sThumb').className = 'th ' + v[8];
    $('#sName').textContent = v[0];
    $('#sDesc').textContent = v[9];
    $('#sPing').className = pc(v[5]);
    $('#sPing').textContent = v[5] + ' мс';
    $('#sMap').textContent = v[2];
    $('#sHost').textContent = v[1];
    $('#sCur').textContent = v[3] + ' / ' + v[4];
    $('#sBar').style.width = Math.round(v[3] / v[4] * 100) + '%';
  }
  var T = { vsync: 1, refl: 1, blur: 0 };
  function fps() {
    var f = 128 - (T.vsync ? 8 : 0) - (T.refl ? 22 : 0) - (T.blur ? 14 : 0);
    $('#fps').textContent = f;
    $('#fpsBar').style.width = Math.round(f / 128 * 100) + '%';
  }
  setMap(0); setSave(0); setSrv(0); fps();

  // navigation
  var POS = { main: 0, 'new': 1, saves: 2, servers: 3, account: 4, settings: 5, notif: 1, create: 4 };
  var gm = $('.gm'), wipe = $('.wipe'), cur = 'main', busy = false;
  function go(t, back) {
    if (busy || t === cur) return;
    busy = true;
    var a = $('#s-' + cur), b = $('#s-' + t);
    a.classList.toggle('b', back);
    a.classList.add('out');
    gm.className = 'gm p' + POS[t];
    wipe.classList.remove('on'); void wipe.offsetWidth; wipe.classList.add('on');
    setTimeout(function () {
      a.classList.remove('on', 'out');
      b.classList.toggle('b', back);
      b.classList.add('on');
      cur = t; busy = false;
    }, 270);
  }
  r.addEventListener('click', function (e) {
    var el = e.target.closest('[data-go]');
    if (el) return go(el.dataset.go, el.dataset.dir === 'b');
    el = e.target.closest('[data-t]');
    if (el) { var k = el.dataset.t; T[k] = T[k] ? 0 : 1; el.classList.toggle('on', !!T[k]); return fps(); }
    el = e.target.closest('[data-sec]');
    if (el) {
      wipe.classList.remove('on'); void wipe.offsetWidth; wipe.classList.add('on');
      [].forEach.call(el.parentNode.children, function (c) { c.classList.toggle('nav-on', c === el); });
      [].forEach.call(el.closest('.scr').querySelectorAll('.sec[data-grp="' + el.dataset.grp + '"]'), function (s) {
        s.hidden = !(s.id === el.dataset.sec || s.dataset.owner === el.dataset.sec);
      });
      return;
    }
    el = e.target.closest('[data-f]');
    if (el) {
      [].forEach.call(el.parentNode.children, function (c) { c.classList.toggle('tab-on', c === el); });
      renderSrv(el.dataset.f);
      var first = $('#srvlist').querySelector('.row'); if (first) setSrv(+first.dataset.i);
      return;
    }
    el = e.target.closest('.tg'); if (el) return el.classList.toggle('on');
    el = e.target.closest('.seg>span');
    if (el) { [].forEach.call(el.parentNode.children, function (c) { c.classList.toggle('on', c === el); }); return; }
    el = e.target.closest('#maps .card'); if (el) return setMap(+el.dataset.i);
    el = e.target.closest('#saves .card'); if (el) return setSave(+el.dataset.i);
    el = e.target.closest('#srvlist .row'); if (el) return setSrv(+el.dataset.i);
  });

  // scale to container width
  var w = $('.gmw');
  function fit() { gm.style.transform = 'scale(' + w.clientWidth / 1440 + ')'; }
  fit();
  if (window.ResizeObserver) new ResizeObserver(fit).observe(w); else addEventListener('resize', fit);
})();
</script>
</body>
</html>
